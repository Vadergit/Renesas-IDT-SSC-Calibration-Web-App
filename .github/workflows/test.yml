name: Offline calibration and browser smoke test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check app.mjs && node --check hardware-ui.mjs && node --check renesas-hardware.mjs && node --check eeprom-viewer.mjs && node --check bridge-reconstruction.mjs && node --check native-wizard.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - uses: actions/checkout@v4
        with:
          repository: Vadergit/ELMOS-E703.11-Calibration-Web-App
          ref: 1239b7641115e037ddd9df59ff8b682ba036b35e
          path: _ui-master
      - run: |
          python3 -m http.server 8000 > /tmp/renesas-http.log 2>&1 &
          node tests/browser-smoke.mjs
      - run: node tests/ui-comparison.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elmos-renesas-ui-comparison
          path: ui-comparison/
