name: Offline calibration and browser smoke test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check app.mjs && node --check hardware-ui.mjs && node --check renesas-hardware.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/renesas-http.log 2>&1 &
          node tests/browser-smoke.mjs
